# ----- General behavior -----

shell_integration enabled
scrollback_lines 10000
copy_on_select clipboard
clear_selection_on_clipboard_loss yes
paste_actions quote-urls-at-prompt,confirm

# ----- Layouts -----

enabled_layouts splits,tall,stack

# ----- Tabs -----
tab_bar_style separator
tab_separator " | "

# ----- Window close behavior -----

confirm_os_window_close 0

# ----- Clipboard / mouse -----

# Windows Terminal-like behavior:
# - Selecting text copies it to the system clipboard immediately.
# - Right-click pastes from the clipboard.
# - Selection clears when clipboard ownership changes.
mouse_map right press ungrabbed paste_from_clipboard

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Mac-like paste when keyd maps Win-V -> Ctrl-V
map ctrl+v paste_from_clipboard

# Mac-like copy when keyd maps Win-C -> Ctrl-C
# Copies if text is selected; otherwise sends interrupt to the shell.
map ctrl+c copy_or_interrupt

# ----- Splits -----

map ctrl+shift+alt+enter launch --location=hsplit
map ctrl+shift+enter launch --location=vsplit
map ctrl+shift+w close_window

# ----- Move between splits -----

map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# ----- Tabs / layouts -----

map ctrl+shift+t new_tab
map ctrl+shift+space next_layout

# ----- Theme -----

# BEGIN_KITTY_THEME
# One Half Dark
include current-theme.conf
# END_KITTY_THEME

# ----- Fonts -----

font_family MesloLGS Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
